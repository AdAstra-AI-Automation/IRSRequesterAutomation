name: Test and deploy IRS PIN

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LIVE-PROD/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r LIVE-PROD/requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s LIVE-PROD/tests -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: irs-pin-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit to EC2
        env:
          EC2_HOST: ${{ secrets.IRS_EC2_HOST }}
          EC2_USER: ${{ secrets.IRS_EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.IRS_EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.IRS_EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing IRS_EC2_HOST}"
          : "${EC2_USER:?Missing IRS_EC2_USER}"
          : "${EC2_SSH_KEY:?Missing IRS_EC2_SSH_KEY}"
          : "${EC2_KNOWN_HOSTS:?Missing IRS_EC2_KNOWN_HOSTS}"
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$EC2_USER@$EC2_HOST" "deploy $GITHUB_SHA"
